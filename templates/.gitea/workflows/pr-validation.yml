# Validacion de PRs: la <version> del pom.xml del PR debe ser MAYOR que la de la rama destino.
name: pr-validation

on:
  pull_request:
    branches: [dev, QA, release, production]
    types: [opened, synchronize, reopened]

jobs:
  version-check:
    name: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar versionamiento del pom.xml
        shell: bash
        run: bash .gitea/scripts/check-version.sh "${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
