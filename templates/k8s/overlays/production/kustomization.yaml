# Ambiente: production  ->  namespace production, http://productos-production.localhost:8081
# El pipeline (deploy) reemplaza newTag por la imagen recien publicada: production-<version>-<sha>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/instance: productos-api-production
images:
  - name: productos-api
    newName: registry:5000/productos-api
    newTag: production-latest
replicas:
  - name: productos-api
    count: 2
patches:
  - target:
      kind: Ingress
      name: productos-api
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: productos-production.localhost
