# Build + push de imagen Docker al registry del home lab.
#
#   Evento                          Tags publicados en registry:5000/productos-api
#   ------------------------------  ----------------------------------------------------------
#   PR hacia dev/QA/release/prod.   pr-<N>, pr-<N>-<sha>
#   push a dev                      dev-<version>-<sha>, dev-latest
#   push a QA                       qa-<version>-<sha>, qa-latest
#   push a release                  release-<version>-<sha>, release-latest, rc-<version>
#   push a production               production-<version>-<sha>, production-latest, <version>, latest
name: docker-build

on:
  push:
    branches: [dev, QA, release, production]
  pull_request:
    branches: [dev, QA, release, production]
    types: [opened, synchronize, reopened]

env:
  REGISTRY: registry:5000
  IMAGE_NAME: productos-api

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}   # tag inmutable <ambiente>-<version>-<sha> que usa el deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular version y tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk '/<artifactId>productos-api<\/artifactId>/{f=1} f && /<version>/{gsub(/.*<version>|<\/version>.*/,""); print; exit}' pom.xml)
          SHA="${GITHUB_SHA::7}"
          IMG="${REGISTRY}/${IMAGE_NAME}"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            PR="${{ github.event.pull_request.number }}"
            TAGS="pr-${PR} pr-${PR}-${SHA}"
            TARGET="${{ github.base_ref }}"
          else
            TARGET="${GITHUB_REF_NAME}"
            ENV=$(echo "$TARGET" | tr '[:upper:]' '[:lower:]')
            TAGS="${ENV}-${VERSION}-${SHA} ${ENV}-latest"
            case "$ENV" in
              release)    TAGS="$TAGS rc-${VERSION}" ;;
              production) TAGS="$TAGS ${VERSION} latest" ;;
            esac
          fi

          REFS=""
          for t in $TAGS; do REFS="$REFS ${IMG}:${t}"; done

          set -- $TAGS
          echo "tag=$1"             >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"         >> "$GITHUB_OUTPUT"
          echo "refs=${REFS# }"     >> "$GITHUB_OUTPUT"
          echo "Evento: ${GITHUB_EVENT_NAME} -> ${TARGET} | version ${VERSION}"
          echo "Imagenes:${REFS}"

      - name: Docker build (incluye mvn package + tests)
        shell: bash
        run: |
          set -euo pipefail
          docker version --format 'Docker engine: {{.Server.Version}}'
          TAG_ARGS=""
          for r in ${{ steps.meta.outputs.refs }}; do TAG_ARGS="$TAG_ARGS -t $r"; done
          docker build $TAG_ARGS \
            --build-arg APP_VERSION=${{ steps.meta.outputs.version }} \
            --build-arg GIT_SHA=${{ steps.meta.outputs.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            .

      - name: Escaneo de la imagen con Trivy (bloquea el push si hay HIGH/CRITICAL)
        shell: bash
        run: |
          set -euo pipefail
          set -- ${{ steps.meta.outputs.refs }}
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache-image:/root/.cache/trivy \
            aquasec/trivy:0.76.2 image \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 "$1"

      - name: Push al registry
        shell: bash
        run: |
          set -euo pipefail
          for r in ${{ steps.meta.outputs.refs }}; do docker push "$r"; done
          {
            echo "### Imagenes publicadas"
            for r in ${{ steps.meta.outputs.refs }}; do
              echo "- \`${r/registry:5000/localhost:5000}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Deploy al cluster k3d: solo en push/merge a una rama de ambiente (no en PRs).
  #   dev -> namespace dev | QA -> qa | release -> release | production -> production
  # Si el rollout o el smoke test fallan, vuelve a la version anterior y el job queda en rojo.
  # --------------------------------------------------------------------------
  deploy:
    name: deploy
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      KUBECTL_VERSION: v1.36.6
      LB: k3d-homelab-serverlb   # load balancer de k3d: API en :6443 e Ingress en :80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar kubectl
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::Falta el secreto KUBECONFIG en el repo. Ejecuta bootstrap.ps1 para crearlo."
            exit 1
          fi
          ARCH=$(dpkg --print-architecture)   # amd64 o arm64
          curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
          chmod +x /usr/local/bin/kubectl
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version

      - name: Aplicar manifiestos
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          NS=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ needs.build-and-push.outputs.tag }}"
          echo "ns=${NS}" >> "$GITHUB_OUTPUT"
          cd "k8s/overlays/${NS}"
          sed -i "s|newTag: .*|newTag: ${TAG}|" kustomization.yaml
          kubectl apply -k .
          kubectl -n "$NS" annotate deployment/productos-api --overwrite \
            kubernetes.io/change-cause="${GITHUB_REF_NAME} ${TAG} (${GITHUB_SHA::7})"

      - name: Esperar el rollout
        shell: bash
        run: kubectl -n "${{ steps.apply.outputs.ns }}" rollout status deployment/productos-api --timeout=180s

      - name: Smoke test por el Ingress
        shell: bash
        run: |
          set -euo pipefail
          HOST="productos-${{ steps.apply.outputs.ns }}.localhost"
          for i in $(seq 1 10); do
            if curl -fsS -H "Host: ${HOST}" "http://${LB}/api/productos"; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::El smoke test fallo: GET http://${HOST}/api/productos"
          exit 1

      - name: Rollback si algo fallo
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          NS="${{ steps.apply.outputs.ns }}"
          kubectl -n "$NS" rollout undo deployment/productos-api || true
          kubectl -n "$NS" rollout status deployment/productos-api --timeout=180s || true
          echo "### :rewind: Deploy fallido en ${NS}: se restauro la version anterior" >> "$GITHUB_STEP_SUMMARY"

      - name: Resumen
        shell: bash
        run: |
          NS="${{ steps.apply.outputs.ns }}"
          {
            echo "### :rocket: Desplegado en \`${NS}\`"
            echo "- Imagen: \`registry:5000/productos-api:${{ needs.build-and-push.outputs.tag }}\`"
            echo "- URL: http://productos-${NS}.localhost:8081/api/productos"
          } >> "$GITHUB_STEP_SUMMARY"
          kubectl -n "$NS" get pods -o wide
