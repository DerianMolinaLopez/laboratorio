# Ambiente: release  ->  namespace release, http://productos-release.localhost:8081
# El pipeline (deploy) reemplaza newTag por la imagen recien publicada: release-<version>-<sha>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: release
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/instance: productos-api-release
images:
  - name: productos-api
    newName: registry:5000/productos-api
    newTag: release-latest
replicas:
  - name: productos-api
    count: 2
patches:
  - target:
      kind: Ingress
      name: productos-api
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: productos-release.localhost
